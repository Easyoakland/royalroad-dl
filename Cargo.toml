[package]
name = "royalroad-dl"
version = "0.1.1"
authors = ["Easyoakland"]
edition = "2021"
description = "Incremental downloader for Royal Road"
readme = "README.md"
repository = "https://github.com/Easyoakland/royalroad-dl"
license = "MIT"

[dependencies]
anyhow = { version = "1.0.79", features = ["backtrace"] }
bpaf = { version = "0.9.9", features = ["derive"] }
ego-tree = "0.10.0"
leaky-bucket = "1.0.1"
regex = "1.10.3"
scraper = { version = "0.22.0", features = ["deterministic"] }
thiserror = "2.0.11"
tokio = { version = "1.35.1", features = ["macros", "fs"] }
url = "2.5.0"
wreq = { version = "0.15.3" }
wreq-util = "0.1.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
